<svg xmlns="http://www.w3.org/2000/svg" viewBox="132 4 756 536" role="img" aria-labelledby="title desc">
  <title id="title">CivicWatch</title>
  <desc id="desc">An eye-shaped civic data mark with a capitol dome, bars, stars, and red and blue contours.</desc>
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="40%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="50%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <radialGradient id="irisGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="70%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.25" />
    </filter>
    <filter id="lightShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.3" />
    </filter>
    <filter id="insetShadow">
      <feOffset dx="4" dy="8" />
      <feGaussianBlur stdDeviation="6" result="offset-blur" />
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse" />
      <feFlood flood-color="black" flood-opacity="0.4" result="color" />
      <feComposite operator="in" in="color" in2="inverse" result="shadow" />
      <feComposite operator="over" in="shadow" in2="SourceGraphic" />
    </filter>
  </defs>
  <g transform="translate(0, -30)">
    <path d="M 140,320 C 280,520 620,550 880,320 C 720,150 420,150 140,320 Z" fill="url(#blueGrad)" filter="url(#dropShadow)" />
    <ellipse cx="460" cy="320" rx="175" ry="145" fill="#ffffff" filter="url(#insetShadow)" />
    <circle cx="460" cy="320" r="145" fill="url(#irisGrad)" filter="url(#insetShadow)" />
    <path d="M 360 400 C 365 385, 370 370, 380 370 L 400 370 C 405 350, 410 330, 410 330 C 410 260, 440 230, 452 225 L 452 215 L 448 215 L 448 210 L 456 210 L 456 195 L 458 195 L 458 185 L 462 185 L 462 195 L 464 195 L 464 210 L 472 210 L 472 215 L 468 215 L 468 225 C 480 230, 510 260, 510 330 C 510 330, 515 350, 520 370 L 540 370 C 550 370, 555 385, 560 400 Z" fill="#ffffff" filter="url(#lightShadow)" />
    <g filter="url(#lightShadow)">
      <rect x="424" y="360" width="20" height="33" rx="2" fill="url(#barGrad)" />
      <rect x="450" y="335" width="20" height="58" rx="2" fill="url(#barGrad)" />
      <rect x="476" y="310" width="20" height="83" rx="2" fill="url(#barGrad)" />
    </g>
    <g transform="translate(680, 240) scale(3) rotate(15)">
      <path d="M0,-10 L2.25,-3.09 L9.51,-3.09 L3.63,1.18 L5.88,8.09 L0,3.82 L-5.88,8.09 L-3.63,1.18 L-9.51,-3.09 L-2.25,-3.09 Z" fill="#ffffff" filter="url(#lightShadow)" />
    </g>
    <g transform="translate(770, 320) scale(3.8) rotate(35)">
      <path d="M0,-10 L2.25,-3.09 L9.51,-3.09 L3.63,1.18 L5.88,8.09 L0,3.82 L-5.88,8.09 L-3.63,1.18 L-9.51,-3.09 L-2.25,-3.09 Z" fill="#ffffff" filter="url(#lightShadow)" />
    </g>
    <g transform="translate(690, 400) scale(3) rotate(-10)">
      <path d="M0,-10 L2.25,-3.09 L9.51,-3.09 L3.63,1.18 L5.88,8.09 L0,3.82 L-5.88,8.09 L-3.63,1.18 L-9.51,-3.09 L-2.25,-3.09 Z" fill="#ffffff" filter="url(#lightShadow)" />
    </g>
    <path d="M 140,320 L 200,180 C 380,30 720,30 880,320 C 720,150 420,150 140,320 Z" fill="url(#redGrad)" filter="url(#dropShadow)" />
  </g>
</svg>
